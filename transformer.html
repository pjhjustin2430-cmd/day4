<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AI는 어떻게 말을 할까요? · 트랜스포머 3D 동화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Jua", "Noto Sans KR", system-ui, sans-serif; color: #3b2a20; user-select: none; touch-action: none;
    background: linear-gradient(180deg, #bfe6ff 0%, #e8f6ff 45%, #fff3d6 100%); }
  canvas#c { position: fixed; inset: 0; display: block; }
  #title { position: fixed; left: 14px; top: 12px; z-index: 5; padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,.85); font-size: 20px; box-shadow: 0 4px 14px rgba(0,0,0,.12); pointer-events: none; }
  #title small { opacity: .55; margin-right: 8px; }
  #cap { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 5; width: min(860px, 92vw); padding: 14px 26px; border-radius: 26px; background: rgba(255,255,255,.94); font-size: clamp(18px, 2.6vw, 28px); line-height: 1.5; text-align: center; box-shadow: 0 8px 26px rgba(0,0,0,.16); min-height: 70px; display: flex; align-items: center; justify-content: center; }
  #cap b { color: #e8590c; }
  #bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; width: min(860px, 94vw); display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.9); box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  #bar button { font: inherit; font-size: 18px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: #ffa94d; color: #fff; cursor: pointer; flex: none; }
  #bar button:active { transform: scale(.94); }
  #bar button.off { background: #ced4da; }
  #seek { flex: 1; min-width: 60px; accent-color: #ff8a1f; }
  #dots { display: flex; gap: 6px; flex: none; }
  #dots i { width: 14px; height: 14px; border-radius: 50%; background: #ced4da; cursor: pointer; }
  #dots i.on { background: #ff8a1f; transform: scale(1.25); }
  #dots i.done { background: #ffd8a8; }
  #intro { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.55), rgba(191,230,255,.9)); }
  #intro.hidden { display: none; }
  #intro h1 { margin: 0; font-size: clamp(34px, 7vw, 72px); color: #e8590c; text-shadow: 0 4px 0 #fff; line-height: 1.15; }
  #intro p { margin: 0; font-size: clamp(16px, 2.4vw, 24px); }
  #intro .robot { font-size: 90px; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-12px); } }
  #go { margin-top: 12px; font: inherit; font-size: 28px; padding: 14px 56px; border-radius: 999px; border: 4px solid #fff; background: #ff8a1f; color: #fff; cursor: pointer; box-shadow: 0 8px 0 #c2570a, 0 14px 28px rgba(255,138,31,.45); }
  #go:active { transform: translateY(4px); box-shadow: 0 4px 0 #c2570a; }
  #intro small { opacity: .65; font-size: 14px; }
  @media (max-width: 600px) { #dots i { width: 10px; height: 10px; } #bar { gap: 5px; padding: 6px 8px; } #bar button { width: 36px; height: 36px; font-size: 15px; } #title { font-size: 15px; } #cap { bottom: 74px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"></div>
<div id="cap"></div>
<div id="bar">
  <button id="prev" title="이전">◀</button>
  <button id="play" title="재생/멈춤">⏸</button>
  <button id="next" title="다음">▶</button>
  <input id="seek" type="range" min="0" max="100" step="0.01" value="0">
  <div id="dots"></div>
  <button id="snd" title="읽어주기">🔊</button>
  <button id="restart" title="처음부터">⟲</button>
</div>
<div id="intro">
  <div class="robot">🤖</div>
  <h1>AI는 어떻게<br>말을 할까요?</h1>
  <p>챗GPT · 제미나이 · 클로드의 비밀을<br>유치원생도 알 수 있게 3D 애니메이션으로 알려줄게요!</p>
  <button id="go">▶ 시작하기</button>
  <small>🔊 소리를 켜면 로봇이 읽어줘요 · 마우스로 화면을 끌면 돌려볼 수 있어요</small>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = id => document.getElementById(id);
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;
const ph = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const easeOut = x => 1 - (1 - x) ** 3;
const easeInOut = x => x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; };
const C = { pink: 0xff8fab, orange: 0xffa94d, yellow: 0xffd43b, green: 0x69db7c, blue: 0x74c0fc, purple: 0xb197fc, teal: 0x38d9a9, red: 0xff6b6b, gray: 0xced4da, brown: 0xe9c99b };
const css = n => '#' + new THREE.Color(n).getHexString();

// ═════════════ 렌더러 / 카메라 / 조명 ═════════════
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0xcfe4ff, 2.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(5, 9, 8); scene.add(sun);

// 배경 장식: 둥둥 떠다니는 별/구름
const deco = [];
for (let i = 0; i < 26; i++) {
  const m = new THREE.Mesh(i % 3 ? new THREE.SphereGeometry(0.12 + Math.random() * 0.18, 12, 10) : new THREE.OctahedronGeometry(0.22),
    new THREE.MeshBasicMaterial({ color: [C.yellow, C.pink, C.blue, C.green, 0xffffff][i % 5], transparent: true, opacity: 0.55 }));
  m.position.set((Math.random() - 0.5) * 30, (Math.random() - 0.5) * 14, -6 - Math.random() * 8); m.userData = { ph: Math.random() * 6, sp: 0.2 + Math.random() * 0.4 };
  scene.add(m); deco.push(m);
}

// ═════════════ 헬퍼: 라벨 / 블록 ═════════════
function rrect(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
function makeLabel(w, h, opts = {}) {
  const cv = document.createElement('canvas'); cv.width = Math.round(w * 170); cv.height = Math.round(h * 170);
  const x = cv.getContext('2d'), tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  let last = '';
  mesh.userData.draw = (lines, o = {}) => {
    const key = JSON.stringify([lines, o]); if (key === last) return; last = key;
    const bg = o.bg ?? opts.bg, color = o.color ?? opts.color ?? '#3b2a20', border = o.border ?? opts.border;
    x.clearRect(0, 0, cv.width, cv.height);
    if (bg) { rrect(x, 5, 5, cv.width - 10, cv.height - 10, Math.min(cv.height * 0.32, 70)); x.fillStyle = bg; x.fill(); if (border) { x.lineWidth = 7; x.strokeStyle = border; x.stroke(); } }
    const arr = Array.isArray(lines) ? lines : [{ t: lines }], n = arr.length;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    arr.forEach((ln, i) => {
      let fs = ln.fs ?? o.fs ?? opts.fs ?? cv.height * 0.6 / n; const maxW = cv.width * 0.9;
      x.font = `${fs}px "Jua","Noto Sans KR",sans-serif`; const mw = x.measureText(ln.t).width; if (mw > maxW) { fs *= maxW / mw; x.font = `${fs}px "Jua","Noto Sans KR",sans-serif`; }
      x.fillStyle = ln.color ?? color; x.fillText(ln.t, cv.width / 2, (i + 0.52) * cv.height / n);
    });
    tex.needsUpdate = true;
  };
  return mesh;
}
function block(text, color, { h = 1.1, d = 0.6, minW = 1.5, wMul = 0.62 } = {}) {
  const w = Math.max(minW, [...text].length * wMul + 0.7), g = new THREE.Group();
  const mesh = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, 0.16), new THREE.MeshStandardMaterial({ color, roughness: 0.55 }));
  const lb = makeLabel(w * 0.94, h * 0.82, { color: '#3b2a20' }); lb.position.z = d / 2 + 0.012; lb.userData.draw(text);
  g.add(mesh, lb); g.userData = { w, h, mesh, label: lb }; return g;
}
const place = (o, x, y, z = 0) => { o.position.set(x, y, z); return o; };
const billboard = (o, p) => { o.lookAt(camera.position); };
const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, ...extra });

// ═════════════ 똑똑이 로봇 (카메라에 붙어 있음) ═════════════
const robot = (() => {
  const g = new THREE.Group(), s = std;
  const head = new THREE.Mesh(new RoundedBoxGeometry(1.6, 1.3, 1.3, 4, 0.3), s(0xa5d8ff)); head.position.y = 1.15;
  const face = new THREE.Mesh(new RoundedBoxGeometry(1.3, 0.9, 0.1, 4, 0.1), s(0xffffff)); face.position.set(0, 1.15, 0.64);
  const eyeM = new THREE.MeshBasicMaterial({ color: 0x2b2b2b }), shine = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const eyes = [-1, 1].map(k => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 12), eyeM); e.position.set(0.32 * k, 1.28, 0.72); const sh = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), shine); sh.position.set(0.04, 0.05, 0.11); e.add(sh); g.add(e); return e; });
  const cheeks = [-1, 1].map(k => { const c = new THREE.Mesh(new THREE.CircleGeometry(0.12, 16), new THREE.MeshBasicMaterial({ color: 0xff9aa8, transparent: true, opacity: 0.8 })); c.position.set(0.5 * k, 1.02, 0.71); g.add(c); });
  const mouth = new THREE.Mesh(new RoundedBoxGeometry(0.4, 0.14, 0.06, 3, 0.05), new THREE.MeshBasicMaterial({ color: 0x7a2d1a })); mouth.position.set(0, 0.95, 0.72);
  const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.45, 8), s(0x868e96)); ant.position.set(0, 2.0, 0);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), new THREE.MeshBasicMaterial({ color: 0xff6b6b })); ball.position.set(0, 2.28, 0);
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.3, 1.0, 0.95, 4, 0.25), s(0xffa94d)); body.position.y = 0.1;
  const chest = new THREE.Mesh(new THREE.CircleGeometry(0.2, 16), new THREE.MeshBasicMaterial({ color: 0xfff3bf })); chest.position.set(0, 0.15, 0.49);
  const armL = new THREE.Mesh(new RoundedBoxGeometry(0.3, 0.8, 0.3, 3, 0.12), s(0xffa94d)); armL.position.set(-0.85, 0.15, 0);
  const armPivot = new THREE.Group(); armPivot.position.set(0.85, 0.5, 0); const armR = new THREE.Mesh(new RoundedBoxGeometry(0.3, 0.8, 0.3, 3, 0.12), s(0xffa94d)); armR.position.y = -0.3; armPivot.add(armR);
  g.add(head, face, mouth, ant, ball, body, chest, armL, armPivot);
  return { g, mouth, ball, eyes, armPivot, head };
})();
camera.add(robot.g);

// ═════════════ 장면 정의 ═════════════
const scenes = [];
const mk = (title, D, beats, cam, build) => { const g = new THREE.Group(); g.position.y = 1.6; g.visible = false; scene.add(g); const s = { title, D, beats, cam, g, w: 8.5, wave: false }; Object.assign(s, build(g, s)); scenes.push(s); };
const camDef = () => ({ pos: [0, 0, 13], look: [0, 0, 0] });

// ─── 0. AI 가족 ───
mk('AI 가족 소개', 26, [
  [0, '안녕! 나는 <b>똑똑이 로봇</b>이야 🤖 오늘은 챗GPT, 제미나이, 클로드가 어떻게 말을 하는지 알려줄게!'],
  [5, '먼저 AI 가족을 소개할게. 제일 큰 집은 <b>인공지능</b>이야. 똑똑하게 일하는 기계를 말해요.'],
  [10, '그 안에 <b>머신러닝</b>이 살아요. 하나하나 가르치지 않아도, 예시를 많이 보면 스스로 배워요.'],
  [15, '그 안에는 <b>딥러닝</b>! 사람 뇌를 흉내 낸 \'생각 층\'을 아주 많이 쌓았어요.'],
  [20, '제일 안쪽에 <b>트랜스포머</b>! 요즘 말 잘하는 AI들이 모두 이 가족이에요.'],
], camDef, (g, S) => {
  const R = [3.4, 2.6, 1.9, 1.2], cols = [C.blue, C.green, C.yellow, C.pink], emo = ['🤖', '📚', '🧠', '💬'], at = [5.5, 10.5, 15.5, 20.5], cx = -3.6;
  const T = [['인공지능 (AI)', '똑똑하게 일하는 기계'], ['머신러닝', '예시를 보고 스스로 배워요'], ['딥러닝', '생각 층이 아주 많아요'], ['트랜스포머', '챗GPT·제미나이·클로드']];
  const discs = R.map((r, i) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.3, 64).rotateX(Math.PI / 2), std(cols[i])); place(m, cx, 0, i * 0.35); g.add(m); return m;
  });
  const emos = R.map((r, i) => { const l = makeLabel(1, 1); l.userData.draw(emo[i], { fs: 100 }); place(l, cx, i < 3 ? r - 0.52 : 0, i * 0.35 + 0.2); g.add(l); return l; });
  const labs = T.map((t, i) => { const l = makeLabel(6.4, 1.3, { bg: css(cols[i]) }); l.userData.draw([{ t: t[0], fs: 62 }, { t: t[1], fs: 34 }]); place(l, 9, [2.3, 0.8, -0.7, -2.2][i], 0); g.add(l); return l; });
  const robotHello = null;
  return { w: 9, update(t) {
    S.wave = t < 5;
    R.forEach((_, i) => {
      const s = Math.max(0.001, back(ph(t, at[i] - 0.6, at[i] + 0.4))), act = t >= at[i] && (i === 3 || t < at[i + 1]), pu = act ? 1 + 0.03 * Math.sin(t * 5) : 1;
      discs[i].scale.setScalar(s * pu); emos[i].scale.setScalar(s);
      const lk = easeOut(ph(t, at[i] - 0.4, at[i] + 0.6)); labs[i].position.x = lerp(9, 3.7, lk); labs[i].material.opacity = lk;
    });
  } };
});

// ─── 1. 다음 말 맞히기 ───
mk('다음 말 맞히기 게임', 28, [
  [0, 'AI가 하는 일은 딱 하나예요. <b>다음에 올 말 맞히기</b>!'],
  [5, '\'나는 아침에 ___\' 다음엔 뭐가 올까요? 보통은 \'밥을\'이라고 말하죠.'],
  [11, 'AI는 후보마다 <b>점수</b>를 매겨요. 막대가 높을수록 \'그럴듯하다\'는 뜻이에요!'],
  [17, '\'밥을\'은 아주 높고, \'자동차를\'은 아주 낮죠? 그래서 \'밥을\'을 골라요!'],
  [23, '이 쉬운 게임을 엄청 잘하게 되면, 신기하게도 <b>대화도 하고 글도 써요</b>!'],
], camDef, (g, S) => {
  const b1 = block('나는', C.blue), b2 = block('아침에', C.green), blank = block('?', C.gray, { minW: 2.2 });
  const row = [b1, b2, blank], tw = row.reduce((a, b) => a + b.userData.w + 0.3, -0.3); let x = -tw / 2;
  row.forEach(b => { x += b.userData.w / 2; place(b, x, 2.5); x += b.userData.w / 2 + 0.3; g.add(b); });
  const names = ['밥을', '우유를', '자동차를'], hs = [3.2, 1.15, 0.25], pcts = ['70%', '25%', '5%'], cols = [C.orange, C.blue, C.pink], xs = [-3.8, 0, 3.8], BASE = -3.0;
  const bars = hs.map((h, i) => { const m = new THREE.Mesh(new RoundedBoxGeometry(1.7, 1, 1.2, 3, 0.15), std(cols[i])); g.add(m); return m; });
  const nl = names.map((n, i) => { const l = makeLabel(2.4, 0.8, { bg: '#fff' }); l.userData.draw(n, { fs: 52 }); place(l, xs[i], BASE - 0.7); g.add(l); return l; });
  const pl = pcts.map(p => { const l = makeLabel(1.6, 0.7, {}); l.userData.draw(p, { fs: 56 }); g.add(l); return l; });
  const q = makeLabel(7, 0.9, {}); q.userData.draw('🎲 다음에 올 말 후보와 점수', { fs: 46 }); place(q, 0, 0.4); g.add(q);
  const fly = block('밥을', C.orange); g.add(fly); fly.visible = false;
  return { update(t) {
    const gr = easeOut(ph(t, 11, 15));
    bars.forEach((m, i) => {
      const h = Math.max(0.001, hs[i] * gr), win = i === 0 && t >= 17;
      m.scale.set(1 + (win ? 0.06 * Math.sin(t * 6) : 0), h, 1); m.position.set(xs[i], BASE + h / 2, 0);
      pl[i].visible = gr > 0.3; place(pl[i], xs[i], BASE + h + 0.5);
    });
    q.visible = t > 9;
    blank.userData.mesh.material.color.set(t >= 20 ? C.orange : C.gray);
    blank.userData.label.userData.draw(t >= 20 ? '밥을' : '?');
    blank.position.y = 2.5 + (t < 11 ? 0.12 * Math.abs(Math.sin(t * 3)) : 0);
    const k = ph(t, 18, 20); fly.visible = k > 0 && k < 1;
    if (fly.visible) { const e = easeInOut(k); fly.position.set(lerp(xs[0], blank.position.x, e), lerp(BASE + hs[0] + 1, 2.5, e) + Math.sin(k * Math.PI) * 1.2, 0.5); }
  } };
});

// ─── 2. 블록으로 쪼개기 (토큰) ───
mk('글을 블록으로 쪼개요', 26, [
  [0, 'AI는 글을 한 번에 읽지 못해요. 먼저 레고 블록처럼 <b>잘게 쪼개요</b>!'],
  [5, '레이저로 슝~ 슝~ 잘라요! \'나는 사과를 좋아해요\'가 작은 조각이 됐어요.'],
  [11, '이 조각을 <b>토큰</b>이라고 불러요. 글자 한 개일 수도, 단어일 수도 있어요.'],
  [16, '조각마다 <b>번호표</b>를 붙여요. 컴퓨터는 글자보다 숫자를 훨씬 잘 알거든요!'],
  [22, '이제 글이 숫자 블록이 되었어요. 다음은 숫자에 \'뜻\'을 담아볼까요?'],
], camDef, (g, S) => {
  const words = ['나는', '사과를', '좋아', '해요'], cols = [C.pink, C.orange, C.green, C.blue], nums = [1052, 8830, 417, 2291];
  const bl = words.map(w => { const b = block(w, C.brown, { h: 1.5, d: 0.8, minW: 1.7 }); g.add(b); return b; });
  const ws = bl.map(b => b.userData.w), tot = ws.reduce((a, b) => a + b, 0), brown = new THREE.Color(C.brown);
  const tags = nums.map(n => { const l = makeLabel(1.9, 0.95, { bg: '#fff', border: '#ff8fab' }); l.userData.draw(String(n), { fs: 66 }); g.add(l); return l; });
  const tok = makeLabel(7.5, 0.9, {}); tok.userData.draw('◀  이 조각 하나하나가 "토큰"  ▶', { fs: 44 }); place(tok, 0, -1.5); g.add(tok);

  robot.mouth.scale.set(1 + (talking ? 0.4 * Math.abs(Math.sin(now * 12)) : 0), talking ? 0.6 + 1.6 * Math.abs(Math.sin(now * 11)) : 0.5, 1);
  robot.ball.material.color.setHex(talking && Math.floor(now * 4) % 2 ? 0xffd43b : 0xff6b6b);
  robot.armPivot.rotation.z = s.wave ? -2.2 + Math.sin(now * 9) * 0.4 : -0.1 + Math.sin(now * 1.5) * 0.05;
  robot.eyes.forEach(e => { e.scale.y = (Math.floor(now * 0.8) % 4 === 0 && (now * 0.8) % 1 < 0.08) ? 0.1 : 1; });

  deco.forEach(d => { d.position.y += Math.sin(now * d.userData.sp + d.userData.ph) * 0.003; d.rotation.y += dt * 0.4; });
  renderer.render(scene, camera);
});
</script>
