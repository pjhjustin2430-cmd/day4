<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const SKY = 0xbfe3dd;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 28, 75);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(4, 10, 15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 3;
controls.maxDistance = 45;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

const sun = new THREE.DirectionalLight(0xfff0d0, 2.4);
sun.position.set(10, 15, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 12, bottom: -12, near: 1, far: 50 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun, new THREE.HemisphereLight(0xdff3ff, 0x6a8f6a, 0.6));

// ───────── 지형: 제주도(동서로 긴 타원) + 한라산 + 오름 + 성산일출봉 + 우도 ─────────
const A = 10, B = 5.2, SEA = -0.12;
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = rng(7);
const oreums = [];
while (oreums.length < 16) {
  const x = (rand() * 2 - 1) * A * 0.8, z = (rand() * 2 - 1) * B * 0.8;
  if ((x / A) ** 2 + (z / B) ** 2 < 0.55 && Math.hypot(x + 0.3, z) > 2.4)
    oreums.push({ x, z, h: 0.18 + rand() * 0.22, s: 0.35 + rand() * 0.35 });
}

function height(x, z) {
  const d = (x / A) ** 2 + (z / B) ** 2;
  let h = SEA;
  if (d < 1) {
    const m = Math.sqrt(1 - d);
    h += m * 0.62;
    const px = x + 0.3;
    h += 1.85 * Math.exp(-(px * px / (2 * 2.8 ** 2) + z * z / (2 * 1.9 ** 2))) * Math.min(1, m * 2);
    h -= 0.3 * Math.exp(-(px * px + z * z) / 0.14);                    // 백록담
    for (const o of oreums) h += o.h * Math.exp(-((x - o.x) ** 2 + (z - o.z) ** 2) / (2 * o.s * o.s)) * m;
  }
  const sx = x - 9.3, sz = z - 0.2, sr = sx * sx + sz * sz;           // 성산일출봉
  h = Math.max(h, SEA + 0.9 * Math.exp(-sr / (2 * 0.3 ** 2)) - 0.2 * Math.exp(-sr / 0.015));
  const ur = (x - 11.8) ** 2 + (z + 2.2) ** 2;                         // 우도
  return Math.max(h, SEA + 0.5 * Math.exp(-ur / (2 * 0.55 ** 2)));
}
const isCanola = (x, z, y) => y > 0.08 && y < 0.45 && z > 0.5 && Math.sin(x * 1.3 + 1) * Math.cos(z * 1.9) > 0.6;

const terrainGeo = new THREE.PlaneGeometry(34, 22, 230, 150);
terrainGeo.rotateX(-Math.PI / 2);
{
  const p = terrainGeo.attributes.position, colors = new Float32Array(p.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), y = height(x, z);
    p.setY(i, y);
    if (y < -0.05) c.set(0x3aa8b0);
    else if (y < 0.06) c.set(0xe8d9a8);
    else if (isCanola(x, z, y)) c.set(0xf3d33a);
    else if (y < 0.95) c.set(0x6bb34f);
    else if (y < 1.55) c.set(0x3f8a3f);
    else c.set(0x8a7f72);
    c.offsetHSL(0, 0, ((Math.sin(x * 12.9898 + z * 78.233) * 43758.5453) % 1) * 0.02);
    colors.set([c.r, c.g, c.b], i * 3);
  }
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  terrainGeo.computeVertexNormals();
}
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
terrain.castShadow = terrain.receiveShadow = true;
scene.add(terrain);

const seabed = new THREE.Mesh(new THREE.PlaneGeometry(240, 240),
  new THREE.MeshStandardMaterial({ color: 0x3aa8b0, roughness: 1 }));
seabed.rotation.x = -Math.PI / 2;
seabed.position.y = SEA - 0.005;
scene.add(seabed);

// ───────── 바다 ─────────
const oceanGeo = new THREE.PlaneGeometry(90, 90, 90, 90);
oceanGeo.rotateX(-Math.PI / 2);
const ocean = new THREE.Mesh(oceanGeo, new THREE.MeshStandardMaterial({
  color: 0x1d9bc4, roughness: 0.15, metalness: 0.1, transparent: true, opacity: 0.82
}));
ocean.receiveShadow = true;
scene.add(ocean);
const oceanBase = oceanGeo.attributes.position.array.slice();

// ───────── 감귤나무(초록 수관 + 귤) ─────────
const TREES = 160, ORANGES = TREES * 4;
const treeMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1),
  new THREE.MeshStandardMaterial({ color: 0x2f7d32, roughness: 0.9 }), TREES);
const orangeMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.035, 10, 10),
  new THREE.MeshStandardMaterial({ color: 0xff8c1a, roughness: 0.5 }), ORANGES);
treeMesh.castShadow = true;
{
  const o = new THREE.Object3D(), dir = new THREE.Vector3();
  let n = 0;
  for (let tries = 0; n < TREES && tries < 6000; tries++) {
    const x = (rand() * 2 - 1) * A, z = (rand() * 2 - 1) * B, y = height(x, z);
    if (y < 0.1 || y > 0.8 || isCanola(x, z, y)) continue;
    const s = 0.1 + rand() * 0.06;
    o.position.set(x, y + s * 0.9, z); o.scale.setScalar(s); o.updateMatrix();
    treeMesh.setMatrixAt(n, o.matrix);
    for (let k = 0; k < 4; k++) {
      dir.set(rand() - 0.5, rand() * 0.8 + 0.1, rand() - 0.5).normalize();
      o.position.set(x + dir.x * s, y + s * 0.9 + dir.y * s, z + dir.z * s); o.scale.setScalar(1); o.updateMatrix();
      orangeMesh.setMatrixAt(n * 4 + k, o.matrix);
    }
    n++;
  }
  treeMesh.count = n; orangeMesh.count = n * 4;
}
scene.add(treeMesh, orangeMesh);

// ───────── 모델 헬퍼 ─────────
const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, ...extra });
const part = (geo, mat, x = 0, y = 0, z = 0) => {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; return m;
};

// 돌하르방
function makeHareubang() {
  const g = new THREE.Group(), stone = std(0x7b7b78, { roughness: 1 }), dark = std(0x222222);
  g.add(part(new THREE.CylinderGeometry(0.08, 0.1, 0.26, 16), stone, 0, 0.13, 0));
  g.add(part(new THREE.SphereGeometry(0.095, 20, 16), stone, 0, 0.34, 0));
  g.add(part(new THREE.CylinderGeometry(0.075, 0.115, 0.07, 20), stone, 0, 0.44, 0));       // 벙거지
  g.add(part(new THREE.SphereGeometry(0.014, 8, 8), dark, -0.035, 0.36, 0.085));
  g.add(part(new THREE.SphereGeometry(0.014, 8, 8), dark, 0.035, 0.36, 0.085));
  g.add(part(new THREE.SphereGeometry(0.022, 10, 10), stone, 0, 0.33, 0.1));                  // 코
  g.add(part(new THREE.SphereGeometry(0.03, 10, 10), stone, -0.075, 0.2, 0.07));              // 손
  g.add(part(new THREE.SphereGeometry(0.03, 10, 10), stone, 0.075, 0.17, 0.07));
  g.scale.setScalar(1.8);
  return g;
}
// 풍력발전기(한경 풍력단지)
function makeTurbine(i) {
  const g = new THREE.Group(), white = std(0xf4f6f8, { roughness: 0.4 });
  g.add(part(new THREE.CylinderGeometry(0.025, 0.045, 1.2, 12), white, 0, 0.6, 0));
  g.add(part(new THREE.BoxGeometry(0.06, 0.06, 0.12), white, 0, 1.22, 0));
  const rotor = new THREE.Group(); rotor.name = 'rotor' + i; rotor.position.set(0, 1.22, 0.09);
  for (let k = 0; k < 3; k++) {
    const arm = new THREE.Group(); arm.rotation.z = k * Math.PI * 2 / 3;
    arm.add(part(new THREE.BoxGeometry(0.035, 0.5, 0.008), white, 0, 0.25, 0));
    rotor.add(arm);
  }
  rotor.add(part(new THREE.SphereGeometry(0.035, 12, 12), white));
  g.add(rotor);
  return g;
}
// 고깃배
function makeBoat(hullColor) {
  const g = new THREE.Group();
  const hullGeo = new THREE.ConeGeometry(0.156, 0.25, 4); hullGeo.rotateY(Math.PI / 4); hullGeo.rotateX(Math.PI / 2);
  g.add(part(new THREE.BoxGeometry(0.22, 0.08, 0.6), std(hullColor), 0, 0.04, 0));
  g.add(part(hullGeo, std(hullColor), 0, 0.04, 0.42));
  g.add(part(new THREE.BoxGeometry(0.16, 0.12, 0.18), std(0xffffff), 0, 0.14, -0.08));
  g.add(part(new THREE.CylinderGeometry(0.01, 0.01, 0.3, 6), std(0x555555), 0, 0.3, 0.12));
  g.add(part(new THREE.BoxGeometry(0.002, 0.08, 0.1), std(0xff4455), 0, 0.42, 0.07));
  g.scale.setScalar(1.3);
  return g;
}
// 비행기(제주공항 → 하늘)
function makePlane() {
  const g = new THREE.Group(), w = std(0xffffff, { roughness: 0.3 }), org = std(0xff7a1a);
  const body = part(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 12), w); body.rotation.x = Math.PI / 2;
  const nose = part(new THREE.ConeGeometry(0.04, 0.12, 12), w, 0, 0, 0.31); nose.rotation.x = Math.PI / 2;
  g.add(body, nose);
  g.add(part(new THREE.BoxGeometry(0.6, 0.012, 0.12), w, 0, -0.01, 0.02));
  g.add(part(new THREE.BoxGeometry(0.2, 0.01, 0.07), w, 0, 0, -0.22));
  g.add(part(new THREE.BoxGeometry(0.012, 0.12, 0.09), org, 0, 0.07, -0.22));
  g.scale.setScalar(1.4);
  return g;
}

// ───────── 배치 ─────────
const labels = [];
function addLabel(text, pos) {
  const el = document.createElement('div'); el.className = 'label'; el.textContent = text;
  const entry = { el, pos: new THREE.Vector3().copy(pos) };
  document.body.appendChild(el); labels.push(entry);
  return entry;
}

const hare = makeHareubang(); { const x = 6.5, z = 2.8; hare.position.set(x, height(x, z), z); }
scene.add(hare);
addLabel('돌하르방', hare.position.clone().add(new THREE.Vector3(0, 0.95, 0)));

const turbines = [-7.6, -6.6, -5.6, -4.6, -3.6].map((x, i) => {
  const t = makeTurbine(i), z = -B * Math.sqrt(1 - (x / A) ** 2) * 0.82;
  t.position.set(x, height(x, z), z); t.rotation.y = -0.4; scene.add(t); return t;
});
addLabel('한경 풍력단지', turbines[2].position.clone().add(new THREE.Vector3(0, 1.5, 0)));
addLabel('한라산 1,947m', new THREE.Vector3(-0.3, 2.6, 0));
addLabel('성산일출봉', new THREE.Vector3(9.3, 1.1, 0.2));
addLabel('우도', new THREE.Vector3(11.8, 0.7, -2.2));

const boats = [makeBoat(0x2f6fd6), makeBoat(0xe8453c)];
boats[0].name = 'boat0'; boats[1].name = 'boat1';
const plane = makePlane(); plane.name = 'plane0';
scene.add(...boats, plane);

// 구름
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.92 });
const clouds = Array.from({ length: 8 }, () => {
  const g = new THREE.Group();
  for (let k = 0; k < 5; k++) {
    const s = 0.5 + rand() * 0.5;
    const m = new THREE.Mesh(new THREE.SphereGeometry(s, 16, 12), cloudMat);
    m.position.set((k - 2) * 0.7, rand() * 0.25, (rand() - 0.5) * 0.6); m.scale.y = 0.6; g.add(m);
  }
  g.position.set((rand() * 2 - 1) * 24, 4.5 + rand() * 2, (rand() * 2 - 1) * 14);
  g.userData.speed = 0.3 + rand() * 0.4;
  scene.add(g); return g;
});

// ───────── 서귀포 직영관광지 관람객 (공공데이터포털) → 3D 기둥 ─────────
// 데이터 앞뒤의 <!--VISITORS:BEGIN/END--> 표시는 제거하고 읽음. 행 형식: [연월, 천지연, 정방, ...] (spots 순서)
const VD = (() => {
  try { return JSON.parse(document.getElementById('visitor-data').textContent.replace(/<!--[\s\S]*?-->/g, '')); } catch (e) { console.warn('관람객 데이터를 읽지 못했어요', e); return null; }
})();
const man = n => (n >= 10000 ? (n / 10000).toFixed(1) + '만' : Math.round(n).toLocaleString('ko-KR'));
const ymText = ym => `${ym.slice(0, 4)}년 ${+ym.slice(5)}월`;
const pillars = [];
const V = { idx: 0, playing: false, acc: 0, max: 1, maxTotal: 1, speed: 1 };
// 관광지 위치: 서귀포 남쪽 해안을 따라 서→동. k = 해안선에서 안쪽으로 들어간 정도(1=해안)
const SPOTS = {
  '산방산_용머리':       { name: '산방산·용머리',   x: -6.3, k: 0.84, c: 0xa0693a },
  '중문대포 주상절리대': { name: '주상절리대',       x: -3.9, k: 0.9,  c: 0x868e96 },
  '천제연폭포':          { name: '천제연폭포',       x: -3.1, k: 0.66, c: 0x2f9e44 },
  '천지연폭포':          { name: '천지연폭포',       x: -0.3, k: 0.86, c: 0x0e7c86 },
  '정방폭포':            { name: '정방폭포',         x: 0.9,  k: 0.9,  c: 0x3b82c4 },
  '감귤박물관':          { name: '감귤박물관',       x: 3.0,  k: 0.74, c: 0xff8a1f },
};
if (VD && VD.rows && VD.rows.length) {
  V.idx = VD.rows.length - 1;
  V.max = Math.max(...VD.rows.flatMap(r => r.slice(1).filter(x => x != null)));
  V.maxTotal = Math.max(...VD.rows.map(r => r.slice(1).reduce((a, b) => a + (b || 0), 0)));
  const pillarGeo = new THREE.CylinderGeometry(0.17, 0.2, 1, 24); pillarGeo.translate(0, 0.5, 0);
  VD.spots.forEach((key, i) => {
    const S = SPOTS[key]; if (!S) return;
    const z = B * Math.sqrt(1 - (S.x / A) ** 2) * S.k, y = Math.max(height(S.x, z), 0);
    const mat = new THREE.MeshStandardMaterial({ color: S.c, emissive: S.c, emissiveIntensity: 0.4, roughness: 0.35, transparent: true, opacity: 0.93 });
    const mesh = new THREE.Mesh(pillarGeo, mat); mesh.position.set(S.x, y, z); mesh.scale.y = 0.02; mesh.castShadow = true;
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.26, 0.4, 36), new THREE.MeshBasicMaterial({ color: S.c, transparent: true, opacity: 0.75, side: THREE.DoubleSide, depthWrite: false }));
    ring.rotation.x = -Math.PI / 2; ring.position.set(S.x, y + 0.03, z);
    const lab = addLabel('', new THREE.Vector3(S.x, y + 0.5, z)); lab.el.classList.add('v'); lab.el.style.setProperty('--c', '#' + new THREE.Color(S.c).getHexString());
    scene.add(mesh, ring);
    pillars.push({ col: i + 1, name: S.name, x: S.x, y, z, mesh, ring, lab, h: 0.02, lift: (pillars.length % 2) * 0.28 });
  });

  const slider = document.getElementById('vslider'), play = document.getElementById('vplay');
  slider.max = VD.rows.length - 1; slider.value = V.idx;
  slider.addEventListener('input', () => { V.idx = +slider.value; V.playing = false; play.textContent = '▶'; });
  play.addEventListener('click', () => {
    V.playing = !V.playing; play.textContent = V.playing ? '⏸' : '▶';
    if (V.playing && V.idx >= VD.rows.length - 1) V.idx = 0;
  });
}
function updateVisitors(dt) {
  if (!pillars.length) return;
  if (V.playing) { V.acc += dt; if (V.acc > 0.45) { V.acc = 0; V.idx++; if (V.idx >= VD.rows.length) { V.idx = VD.rows.length - 1; V.playing = false; document.getElementById('vplay').textContent = '▶'; } document.getElementById('vslider').value = V.idx; } }
  const row = VD.rows[V.idx];
  let total = 0;
  for (const p of pillars) {
    const val = row[p.col]; if (val != null) total += val;
    const target = val == null ? 0.03 : Math.max(0.05, val / V.max * 3.2);
    p.h += (target - p.h) * Math.min(1, dt * 6);
    p.mesh.scale.y = p.h;
    p.lab.pos.set(p.x, p.y + p.h + 0.32 + p.lift, p.z);
    p.lab.el.textContent = `${p.name} ${val == null ? '미집계' : man(val)}`;
    p.ring.scale.setScalar(1 + 0.12 * Math.sin(performance.now() / 400 + p.col));
  }
  document.getElementById('vmonth').textContent = ymText(row[0]);
  document.getElementById('vtotal').textContent = `합계 ${man(total)}명`;
  // 관광객이 많은 달일수록 배·비행기가 바빠짐 (애니메이션 재생 속도에 연동)
  V.speed += ((0.55 + 1.15 * total / V.maxTotal) - V.speed) * Math.min(1, dt * 3);
  for (const k of ['boat0', 'boat1', 'plane0']) if (actions[k]) actions[k].timeScale = V.speed;
}

// ───────── 키프레임 애니메이션 (AnimationMixer) ─────────
const mixer = new THREE.AnimationMixer(scene);
const dummy = new THREE.Object3D();

function pathClip(name, pts, duration, bank = 0) {
  const N = pts.length - 1;                           // 마지막 점 = 첫 점 (폐곡선)
  const times = [], pv = [], qv = [];
  let prev = null;
  for (let i = 0; i <= N; i++) {
    dummy.position.copy(pts[i]); dummy.rotation.set(0, 0, 0); dummy.quaternion.identity();
    dummy.updateMatrixWorld(true);
    dummy.lookAt(pts[(i + 1) % N]);
    if (bank) dummy.rotateZ(bank);
    const q = dummy.quaternion.clone();
    if (prev && q.dot(prev) < 0) q.set(-q.x, -q.y, -q.z, -q.w);
    prev = q;
    times.push(i * duration / N);
    pv.push(pts[i].x, pts[i].y, pts[i].z);
    qv.push(q.x, q.y, q.z, q.w);
  }
  return new THREE.AnimationClip(name, duration, [
    new THREE.VectorKeyframeTrack(`${name}.position`, times, pv),
    new THREE.QuaternionKeyframeTrack(`${name}.quaternion`, times, qv),
  ]);
}
function ellipse(rx, rz, n, yFn, dir = 1) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = dir * i / n * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * rx, yFn(i), Math.sin(a) * rz));
  }
  pts.push(pts[0].clone());
  return pts;
}

const clips = [
  pathClip('boat0', ellipse(12.5, 7.2, 48, i => 0.03 + 0.02 * Math.sin(i * 1.3)), 70),
  pathClip('boat1', ellipse(14.8, 8.6, 56, i => 0.03 + 0.02 * Math.sin(i * 1.7), -1), 95),
  pathClip('plane0', ellipse(13, 7.5, 40, i => 3.4 + 0.25 * Math.sin(i * 0.5)), 32, 0.35),
];
turbines.forEach((_, i) => {
  const q0 = new THREE.Quaternion(), q1 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI * 2 / 3);
  clips.push(new THREE.AnimationClip(`rotor${i}`, 2 + i * 0.25, [
    new THREE.QuaternionKeyframeTrack(`rotor${i}.quaternion`, [0, 2 + i * 0.25], [...q0.toArray(), ...q1.toArray()]),
  ]));
});
// 돌하르방이 살짝 고개를 끄덕이는 키프레임
hare.name = 'hare';
{
  const e = (x) => new THREE.Quaternion().setFromEuler(new THREE.Euler(x, 0, 0)).toArray();
  clips.push(new THREE.AnimationClip('hare', 3, [
    new THREE.QuaternionKeyframeTrack('hare.quaternion', [0, 1.5, 3], [...e(0), ...e(0.06), ...e(0)]),
  ]));
}
const actions = {};
clips.forEach(c => { const a = mixer.clipAction(c); a.play(); actions[c.name] = a; });

// ───────── 렌더 루프 ─────────
const clock = new THREE.Clock(false);
const v = new THREE.Vector3();
function updateLabels() {
  for (const { el, pos } of labels) {
    v.copy(pos).project(camera);
    el.style.display = v.z > 1 ? 'none' : '';
    el.style.transform = `translate(${(v.x * 0.5 + 0.5) * innerWidth}px, ${(-v.y * 0.5 + 0.5) * innerHeight}px) translate(-50%, -100%)`;
  }
}
const op = oceanGeo.attributes.position;
function animate() {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  updateVisitors(dt);
  mixer.update(dt);
  for (const c of clouds) { c.position.x += dt * c.userData.speed; if (c.position.x > 26) c.position.x = -26; }
  for (let i = 0; i < op.count; i++) {
    const x = oceanBase[i * 3], z = oceanBase[i * 3 + 2];
    op.setY(i, Math.sin(x * 0.6 + t * 1.2) * 0.02 + Math.cos(z * 0.5 + t * 0.9) * 0.02);
  }
  op.needsUpdate = true; oceanGeo.computeVertexNormals();
  controls.update();
  updateLabels();
  renderer.render(scene, camera);
}

// 시작 화면: 버튼을 누르면 애니메이션 실행
mixer.update(0);
renderer.render(scene, camera);
updateLabels();
document.getElementById('start').addEventListener('click', () => {
  document.getElementById('intro').remove();
  if (pillars.length) document.getElementById('vpanel').classList.remove('hidden');
  clock.start();
  renderer.setAnimationLoop(animate);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
